schema = 1
main = "paper.tex"
lean_project = "host"
mode = "external"
imports = ["Riemann"]
notation = ["notation/RiemannTeX.lean"]
strip_namespaces = ["Riemann", "HurwitzZeta", "WeakFEPair", "Complex", "DirichletCharacter"]

# The public version links every statement to its Lean on GitHub:
# imprimatur build --profile public --commit SHA (DESIGN §11).
[profile.public]
source_links = "url"
url_template = "https://github.com/theorem-press/imprimatur/blob/{commit}/examples/riemann/host/{path}#L{line}"

[aliases]
# Each statement is a claim: a theorem whose proof is not in this development.
leanclaim = { view = "prose", wrap = "claim", label = "claim:{key}" }
leannotation = { view = "vocabulary|scope=all" }
leanprovenance = { view = "provenance" }
# The preliminaries: Mathlib's definitions, as their equations, and the lemmas
# that characterise the definitions Mathlib makes irreducible.
leandefinition = { view = "math", wrap = "definition", label = "def:{key}", template = "\\label{{label}}\n\\[{content}\\]" }
leanfact = { view = "math", wrap = "fact", label = "fact:{key}", template = "\\label{{label}}\n\\[{content}\\]" }
