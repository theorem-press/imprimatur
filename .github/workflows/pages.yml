# Publishes the repository's Markdown as a GitHub Pages site (see _config.yml).
# On the Free plan Pages only serves public repositories, so the deploy job is
# skipped while the repository is private; the build still runs as a check.
name: Pages

on:
  push:
    branches: [main]
  pull_request:
    paths: ["**/*.md", "_config.yml", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The site links the PDF of examples/semantics, built here by the
      # commands of README's "Try it in two minutes" (keep the two in step):
      # so every push to main runs that block. Jekyll copies the PDF from
      # where latexmk leaves it to /examples/semantics/paper.pdf.
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Install TeX Live (pdflatex, latexmk)
        run: |
          sudo apt-get update -q
          sudo apt-get install -q -y --no-install-recommends latexmk texlive-latex-base \
            texlive-latex-recommended texlive-latex-extra texlive-fonts-recommended \
            texlive-science lmodern
      # The extractor's cache is not kept: the block then installs it on every
      # run, as it does for a newcomer, which is the test of that install.
      - uses: actions/cache@v4
        with:
          path: |
            ~/.elan/toolchains
            splice/.lake
          key: pages-${{ hashFiles('**/lean-toolchain', '**/lakefile.toml') }}-${{ github.sha }}
          restore-keys: pages-${{ hashFiles('**/lean-toolchain', '**/lakefile.toml') }}-
      - name: Build the PDF of examples/semantics (README's Try it block)
        env:
          IMPRIMATUR_CACHE: ${{ runner.temp }}/imprimatur-cache
        run: |
          (cd splice && lake build -q) && export PATH="$PWD/splice/.lake/build/bin:$PATH"
          cd examples/semantics
          (cd host && lake build -q)
          imprimatur build   # installs the extractor for the host's Lean when the cache is cold
          imprimatur check
          git diff --stat paper.tex
          latexmk -pdf -interaction=nonstopmode -halt-on-error paper.tex
          git checkout -- paper.tex   # the source stays as committed; the site gets the PDF
      - name: Build with Jekyll
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Upload site
        if: github.event_name != 'pull_request' && !github.event.repository.private
        uses: actions/upload-pages-artifact@v3

  deploy:
    needs: build
    if: github.event_name != 'pull_request' && !github.event.repository.private
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
