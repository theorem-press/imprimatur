# The Lean the paper in ../ reads in external mode: the splicer's model, with
# its laws and the soundness of `imprimatur check` (DESIGN §18.2), which
# lives in the splice package, and the paper's example.
name = "imprimatur-about"
defaultTargets = ["About"]

# The splicer's package, for its model (`SpliceModel`) and the bundle's type
# (`Imprimatur.Bundle`). This package is not shipped, so it may depend on it.
[[require]]
name = "imprimatur-splice"
path = "../../splice"

# What the paper reads: the model and the example. Building it builds both.
[[lean_lib]]
name = "About"

# The paper's example, a small simply typed λ-calculus (Section 1).
[[lean_lib]]
name = "Stlc"
