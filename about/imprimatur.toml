schema = 1
main = "imprimatur-paper.tex"
lean_project = "lean"
mode = "external"
imports = ["SpliceModel", "Stlc", "About"]
notation = ["notation/SpliceTeX.lean", "notation/StlcTeX.lean"]
strip_namespaces = ["SpliceModel", "Stlc", "Imprimatur.Layout"]

[aliases]
# The paper's own environments, each with the view it shows.
leangrammar = { view = "grammar|display", wrap = "LeanDisplayBox", label = "gram:{key}", template = "\\label{{label}}{content}" }
leantheorem = { view = "prose", wrap = "theorem", label = "thm:{key}" }
leanrules   = { view = "rules" }
leandef     = { view = "clauses", wrap = "LeanDisplayBox" }
leansource  = { view = "lean" }
# The TeX of a prose block, and the formulas it comes apart into.
leananatomy = { view = "about.prose-anatomy" }
# Appendix A: the metavariables, and the notation the paper uses.
leanconventions = { view = "conventions" }
leannotation    = { view = "vocabulary|scope=all" }
