# Aliases for llmbda's environments, for scanning its paper.tex when llmbda
# has no imprimatur.toml of its own (integration/llmbda-scan-strip).
schema = 1
main = "paper.tex"

[aliases]
leangrammar     = { view = "grammar", slots = { macros = ["\\entry", "\\defentry", "\\Category"], arg = 2, id = "arg1" } }
leanrules       = { view = "rules" }
leantheorem     = { view = "math", wrap = "theorem" }
leancorollary   = { view = "math", wrap = "corollary" }
leanlemma       = { view = "math", wrap = "lemma" }
leandef         = { view = "math", wrap = "definition" }
leanconventions = { view = "math" }
leantranslation = { view = "math" }
LEANCLAUSE      = { view = "math", comment = true }
